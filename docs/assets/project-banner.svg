<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">SASD Historical Software Archive</title><desc id="desc">Retro computing archive banner with a green phosphor terminal, magnetic tape, floppy disk and a historical timeline.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111e24"/><stop offset="1" stop-color="#081116"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#40695a" stop-opacity=".36"/><stop offset="1" stop-color="#18282c" stop-opacity="0"/></radialGradient>
 <linearGradient id="case" x2=".15" y2="1"><stop stop-color="#d1c5a5"/><stop offset=".52" stop-color="#aca48b"/><stop offset="1" stop-color="#77796e"/></linearGradient>
 <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#142d24"/><stop offset="1" stop-color="#07170f"/></linearGradient>
 <linearGradient id="tape" x2="1" y2="1"><stop stop-color="#626b62"/><stop offset="1" stop-color="#252f30"/></linearGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8ea7a0" stroke-opacity=".075"/></pattern>
 <pattern id="scan" width="3" height="4" patternUnits="userSpaceOnUse"><path d="M0 1H3" stroke="#06140e" stroke-opacity=".32"/></pattern>
 <pattern id="vent" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="4" height="8" rx="1" fill="#63685e"/></pattern>
 <clipPath id="crt"><rect x="827" y="187" width="331" height="221" rx="24"/></clipPath>
</defs>
<rect width="1280" height="640" fill="url(#bg)"/><rect width="1280" height="640" fill="url(#grid)"/>
<ellipse cx="1000" cy="315" rx="350" ry="310" fill="url(#halo)"/>
<rect x="28" y="28" width="1224" height="584" rx="4" fill="none" stroke="#50625d" stroke-opacity=".6"/>
<path d="M28 78V28H78M1202 28H1252V78M28 562V612H78M1202 612H1252V562" fill="none" stroke="#c6a76b" stroke-width="2"/>
<!-- Editorial text -->
<g font-family="DejaVu Sans Mono, monospace" font-size="14" letter-spacing="2">
 <rect x="64" y="63" width="9" height="9" fill="#e8bc71"/>
 <text x="86" y="73" fill="#e8bc71">SASD / DIGITAL PRESERVATION</text>
 <text x="1216" y="73" fill="#8ca5a0" text-anchor="end">RESEARCH  •  OPEN SOURCE</text>
</g>
<path d="M64 93H1216" stroke="#455a55"/>
<g font-family="DejaVu Sans, sans-serif" font-weight="bold" fill="#f0e9d8">
 <text x="60" y="184" font-size="70" fill="#e8bc71">SASD</text>
 <text x="60" y="253" font-size="59" letter-spacing="-1.4">Historical</text>
 <text x="60" y="320" font-size="59" letter-spacing="-1.4">Software Archive</text>
</g>
<rect x="64" y="351" width="63" height="3" fill="#e8bc71"/>
<g font-family="DejaVu Sans, sans-serif" fill="#becfc5" font-size="23">
 <text x="64" y="398">Preserving the past.</text>
 <text x="64" y="430">Reproducing computing history.</text>
</g>
<g font-family="DejaVu Sans Mono, monospace" font-size="13.5" fill="#99c4a6">
 <text x="64" y="483">DISCOVER</text><text x="157" y="483" fill="#c5a66c">→</text><text x="181" y="483">ACQUIRE</text><text x="261" y="483" fill="#c5a66c">→</text><text x="286" y="483">VERIFY</text><text x="357" y="483" fill="#c5a66c">→</text><text x="382" y="483">PRESERVE</text>
</g>
<!-- Tape and disk behind terminal -->
<g transform="translate(699 111) rotate(-12 90 90)">
 <circle cx="90" cy="90" r="82" fill="#071014" opacity=".8"/><circle cx="90" cy="85" r="80" fill="url(#tape)" stroke="#a7ab93" stroke-width="2"/>
 <circle cx="90" cy="85" r="68" fill="#242e30" stroke="#89948a"/>
 <circle cx="90" cy="85" r="54" fill="none" stroke="#8c7655" stroke-width="14"/>
 <g fill="#6e7c71" stroke="#a1a590" stroke-width="1"><path d="M78 72L57 28Q90 13 123 28L102 72Z"/><path d="M78 72L57 28Q90 13 123 28L102 72Z" transform="rotate(120 90 85)"/><path d="M78 72L57 28Q90 13 123 28L102 72Z" transform="rotate(240 90 85)"/></g>
 <circle cx="90" cy="85" r="22" fill="#b1a78c" stroke="#363e39" stroke-width="3"/><circle cx="90" cy="85" r="9" fill="#182225"/>
</g>
