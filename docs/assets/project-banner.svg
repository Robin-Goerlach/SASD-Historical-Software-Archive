<ellipse cx="990" cy="512" rx="229" ry="20" fill="#050c10" opacity=".75"/>
<path d="M811 149L851 124H1165L1208 154V419L1184 447H811Z" fill="#60665b" stroke="#171f21" stroke-width="3"/>
<rect x="798" y="145" width="391" height="304" rx="22" fill="url(#case)" stroke="#e1d3ae" stroke-width="2"/>
<rect x="812" y="168" width="361" height="250" rx="30" fill="#353f39" stroke="#757c70" stroke-width="3"/>
<rect x="827" y="187" width="331" height="221" rx="24" fill="url(#screen)" stroke="#111e19" stroke-width="4"/>
<g clip-path="url(#crt)">
 <rect x="827" y="187" width="331" height="221" fill="url(#scan)"/>
 <path d="M844 202Q987 182 1142 202" fill="none" stroke="#c6e7c3" stroke-opacity=".12" stroke-width="3"/>
 <g font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#9de9ab">
  <text x="850" y="225" font-size="13" fill="#76a98b">SASD ARCHIVE  /  CONCEPT</text>
  <path d="M850 238H1133" stroke="#507c5e" stroke-dasharray="3 4"/>
  <text x="850" y="265">$ discover history</text>
  <text x="850" y="294" fill="#b0d9ad">  source code</text>
  <text x="850" y="317" fill="#b0d9ad">  release artifacts</text>
  <text x="850" y="340" fill="#b0d9ad">  documentation</text>
  <text x="850" y="374">$</text><rect x="872" y="360" width="10" height="17" fill="#a9efad"/>
 </g>
</g>
<g fill="#4b5247"><rect x="826" y="428" width="55" height="8" fill="url(#vent)"/><text x="907" y="436" font-size="9" font-family="DejaVu Sans Mono, monospace" letter-spacing="1">HISTORICAL SYSTEMS</text><circle cx="1152" cy="432" r="4" fill="#9cde83" stroke="#525b45"/></g>
<path d="M929 450H1069L1080 477H914Z" fill="#777b6c" stroke="#353e39" stroke-width="2"/><rect x="874" y="476" width="244" height="16" rx="5" fill="#b3aa90" stroke="#51594f" stroke-width="2"/>
<!-- Floppy disk foreground -->
<g transform="translate(692 354) rotate(-10 70 78)">
 <rect x="0" y="4" width="135" height="142" rx="5" fill="#080e13" opacity=".85"/>
 <path d="M0 0H117L135 18V140H0Z" fill="#2e454c" stroke="#748b88" stroke-width="2"/>
 <rect x="29" y="0" width="77" height="51" rx="2" fill="#adb7ad"/><rect x="75" y="6" width="18" height="39" rx="2" fill="#213238"/>
 <rect x="12" y="65" width="111" height="63" rx="2" fill="#d9cfaf"/><rect x="12" y="65" width="111" height="13" fill="#b89258"/>
 <g font-family="DejaVu Sans Mono, monospace" fill="#3c4c47"><text x="20" y="94" font-size="12" font-weight="bold">SOURCE</text><text x="20" y="110" font-size="10">ARCHIVE</text><path d="M20 119H112" stroke="#a69e88"/></g>
</g>
<!-- Footer -->
<path d="M64 540H1216" stroke="#455a55"/>
<g font-family="DejaVu Sans Mono, monospace" font-size="13" letter-spacing="1" fill="#91a9a3">
 <text x="64" y="579">UNIX / LINUX  •  SOFTWARE ARCHAEOLOGY</text><text x="1216" y="579" text-anchor="end" fill="#e8bc71">PAST → PRESENT → FUTURE</text>
</g>
</svg>
